name: Link Check (lychee)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 10 * *'

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 2
            --exclude 'github\.com/owner/repo'
            --exclude-path './.git'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
